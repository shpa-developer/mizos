<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>Mizos — Feature Graphic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1024px; height: 500px; overflow: hidden; }
  .canvas {
    width: 1024px;
    height: 500px;
    background: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle grid pattern */
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(45,91,227,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,91,227,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Accent glow */
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(45,91,227,0.12) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .logo {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 96px;
    font-weight: 700;
    letter-spacing: -2px;
    color: #FFFFFF;
  }
  .logo span { color: #2D5BE3; }

  .tagline {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
  }

  .chips {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 8px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    color: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <div class="content">
    <div class="logo">mizo<span>s</span></div>
    <div class="tagline">Your measurements, always handy</div>
    <div class="chips">
      <div class="chip">👕 Shirts</div>
      <div class="chip">👖 Pants</div>
      <div class="chip">👟 Shoes</div>
      <div class="chip">👓 Eyeglasses</div>
      <div class="chip">💍 Rings</div>
      <div class="chip">📏 Body</div>
    </div>
  </div>
</div>
</body>
</html>
